
<div class="header">
    <button class="btn btn-secondary" routerLink="/report-incident">← Back</button>
  </div>
  
  <table *ngIf="!loading && incidents.length" class="incident-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Category</th>
        <th>Reporter</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let incident of incidents">
        <td>{{ incident.title }}</td>
        <td>{{ incident.description }}</td>
        <td>
          <span class="status-badge">{{ incident.status }}</span>
        </td>
        <td>{{ incident.priority }}</td>
        <td>{{ incident.category }}</td>
        <td>{{ incident.reporter.username }}</td>
        <td>
          <div class="incident-actions">
            <button *ngIf="incident.status === 'Open'" class="btn btn-warning" (click)="onEdit(incident)">Edit</button>
            <button *ngIf="incident.status === 'Open'" class="btn btn-danger" (click)="onDelete(incident.id!)">Delete</button>
            <ng-container *ngIf="incident.status !== 'Open'">
              <i class="bi bi-lock" title="Locked" style="font-size: 1.5rem; color: #dc3545;"></i>
            </ng-container>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  
  
  <div *ngIf="selectedIncident" class="modal-overlay">
    <div class="modal-content">
      <h2>Edit Incident</h2>
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="title">Title:</label>
          <input id="title" formControlName="title" class="form-control" required>
        </div>
  
        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" formControlName="description" class="form-control" rows="4" required></textarea>
        </div>
  
        <div class="form-group">
          <label for="category">Category:</label>
          <select id="category" formControlName="category" class="form-control" required>
            <option value="">Select a category</option>
            <option value="NETWORK">Network</option>
            <option value="HARDWARE">Hardware</option>
            <option value="SOFTWARE">Software</option>
            <option value="DATABASE">Database</option>
            <option value="SECURITY">Security</option>
          </select>
        </div>
  
  
  
        <div class="form-group">
          <label for="priority">Priority:</label>
          <select id="priority" formControlName="priority" class="form-control" required>
            <option value="1">Low (1)</option>
            <option value="2">Medium (2)</option>
            <option value="3">High (3)</option>
            <option value="4">Critical (4)</option>
          </select>
        </div>
  
        <div class="form-buttons">
          <button type="button" class="btn btn-secondary" (click)="selectedIncident = null">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
