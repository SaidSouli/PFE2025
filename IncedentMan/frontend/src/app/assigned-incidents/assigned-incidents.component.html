<div class="incident-list">
    <h2>Incidents Assigned to {{ username }}</h2>

    <!-- Logout and Back Buttons -->
    <div class="button-group">
    <button class="back-button" (click)="back()">Back</button>
    <button class="logout-button" (click)="logout()">Logout</button>

    </div>

    <ul>
      <li *ngFor="let incident of filteredIncidents" class="incident-item">
        <h3>{{ incident.title }}</h3>
        <p><strong>Description:</strong> {{ incident.description }}</p>
        <p><strong>Category:</strong> {{ incident.category }}</p>
        <p><strong>Status:</strong> {{ incident.status }}</p>
        <p><strong>Priority:</strong> {{ incident.priority }}</p>
        <p><strong>Creation Date:</strong> {{ incident.creationDate }}</p>

        <!-- Solution Area -->
        <div class="solution-area">
          <textarea placeholder="Enter your solution here..." rows="4"></textarea>
          <button class="submit-button">Submit Solution</button>
        </div>
      </li>
    </ul>
  </div>
