
<div class="page-wrapper">
  <header class="header">
    <div class="container">
      <div class="header-content">
        <img src="saiph-logo.jpg" 
             alt="Saiph Logo" 
             class="logo">
        <h1 class="title">Incident Management System</h1>
      </div>
    </div>
  </header>

  <main class="content-area">
    <div class="container">
      <div class="form-container">
        <div class="mt-3">
          <a routerLink="/incident-consult" class="btn btn-secondary">See my reported incident</a>
        </div>
        <h2 class="form-title">Report Incident</h2>
        
        <form [formGroup]="incidentForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label class="form-label">Title</label>
            <input
              type="text"
              formControlName="title"
              class="form-input"
              placeholder="Brief title describing the issue"
            >
            <div *ngIf="isFieldInvalid('title')" class="error-message">
              Title is required
            </div>
          </div>

          <div class="grid">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select
                formControlName="category"
                class="form-select"
              >
              <option value="" disabled>Select a category</option>
              @for (option of categoryOptions; track option) {
                <option [value]="option">{{option}}</option>
              }
              </select>
              <div *ngIf="isFieldInvalid('category')" class="error-message">
                Please select a category
              </div>
            <div class ="ai-suggestion" *ngIf="showCategoryPrediction && aiPrediction">
              <span class = "ai-icon">🤖</span> AI suggests: <strong>{{aiPrediction.category}}</strong>
              <button type="button" class="suggestion-btn" (click)="useAiCategory()">Use this</button>
            </div>
            </div>

            <div class="form-group">
              <label class="form-label">Priority</label>
              <select 
                formControlName="priority" 
                class="form-select"
              >
              <option value="" disabled>Select a priority</option>
              @for (option of priorityOptions; track option) {
                <option [value]="option.label">{{option.label}}</option>
              }
              </select>
              <div *ngIf="isFieldInvalid('priority')" class="error-message">
                Please select a priority
              </div>
              <div class="ai-suggestion" *ngIf="showPriorityPrediction && aiPrediction">
                <span class="ai-icon" >🤖</span> AI suggests <strong>{{getPriorityDisplay()}}</strong>
                <button type="button" class="suggestion-btn" (click)="useAiPriority()">Use this</button>
              </div>
            </div>
            
          </div>
       

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea
              formControlName="description"
              rows="6"
              class="form-textarea"
              placeholder="Detailed description of the issue"
            ></textarea>
            <div *ngIf="isFieldInvalid('description')" class="error-message">
              Description is required
            </div>
          </div>

          <button
            type="submit"
            [disabled]="incidentForm.invalid || isSubmitting"
            class="submit-button"
          >
            {{ isSubmitting ? 'Submitting...' : 'Submit Incident Report' }}
          </button>

          <div *ngIf="submitSuccess" class="success-message">
            Incident reported successfully!
          </div>

          <div *ngIf="errorMessage" class="error-alert">
            {{ errorMessage }}
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
