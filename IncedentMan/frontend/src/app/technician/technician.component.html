<div class="saiph-container">
  <header class="saiph-header">
    <div class="logo-container">
      <div class="logo-star">
        <span class="star-point star-point-1"></span>
        <span class="star-point star-point-2"></span>
        <span class="star-point star-point-3"></span>
        <span class="star-point star-point-4"></span>
      </div>
      <h1>SAIPH</h1>
      <p class="tagline">Laboratoire Pharmacologique Citoyen </p>
    </div>
    <button class="logout-button" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      Logout
    </button>
  </header>

  <!-- Original content below - unchanged -->
  <div class="incidents-list">
    <div class="list-header">
      <h2>Incidents Ready for Your Specialization</h2>
      <button class="assigned-button" (click)="goToAssignedIncidents()">
        View Assigned Incidents
      </button>
    </div>
    
    <div class="table-container">
      <table class="incidents-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Category</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let incident of openIncidents">
            <td class="title-cell">{{ incident.title }}</td>
            <td class="description-cell">{{ incident.description }}</td>
            <td>
              <span class="status-badge">{{ incident.status }}</span>
            </td>
            <td>
              <span class="priority-badge" [ngClass]="'priority-' + incident.priority">
                {{ getPriorityLabel(incident.priority) }}
              </span>
            </td>
            <td>
              <span class="category-badge">{{ incident.category }}</span>
            </td>
            <td>
              <button class="take-charge-button" (click)="takeCharge(incident.id!)">
                Take in Charge
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
